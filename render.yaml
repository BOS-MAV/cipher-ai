services:
  - type: web
    name: cipher-ai-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: CIPHER_CLIENT_ID
        sync: false
      - key: CIPHER_CLIENT_SECRET
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5
      - key: ALLOWED_ORIGINS
        sync: false
