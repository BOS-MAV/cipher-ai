<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="Natural-language search of CIPHER phenotypes and data dictionaries." />
  <title>CIPHER AI</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="shell">
    <header>
      <div class="eyebrow">CIPHER phenotype library</div>
      <h1>Ask CIPHER</h1>
      <p class="lede">Search phenotypes, algorithms, variables, and data dictionaries in natural language.</p>
    </header>

    <section class="card">
      <label for="question">Question</label>
      <textarea id="question" rows="5" placeholder="Example: Find validated hypertension phenotypes that use diagnosis codes."></textarea>
      <div class="actions">
        <button id="askButton">Ask CIPHER</button>
        <span id="status" aria-live="polite"></span>
      </div>
    </section>

    <section class="card answer-card" id="answerCard" hidden aria-live="polite">
      <div class="answer-heading">
        <div>
          <div class="result-label" id="resultLabel">CIPHER result</div>
          <h2 id="answerTitle">Answer</h2>
        </div>
        <button class="copy-button" id="copyButton" type="button" hidden>Copy answer</button>
      </div>
      <div id="answer" class="answer-content"></div>
      <details id="toolDetails">
        <summary>Queries used</summary>
        <div id="tools" class="tool-list"></div>
      </details>
    </section>

    <footer>
      <p>CIPHER AI retrieves and explains CIPHER records. It is not a clinical decision tool.</p>
    </footer>
  </main>
  <script src="config.js"></script>
  <script src="app.js?v=5"></script>
  <script>
    // Kept inline so GitHub Pages cannot serve an older response formatter.
    (() => {
      const answer = document.getElementById("answer");
      const copyButton = document.getElementById("copyButton");
      let plainAnswer = "";

      const clean = (text) => text.replace(/\*\*/g, "").replace(/[“”]/g, '"').trim();

      function formatCipherAnswer() {
        if (!answer.textContent.includes("**")) return;

        plainAnswer = answer.innerText;
        const lines = plainAnswer.split("\n").map(line => line.trim()).filter(Boolean);
        const fragment = document.createDocumentFragment();
        let cardBody = null;

        for (const line of lines) {
          const record = line.match(/^\d+[.)]\s+\*\*(.+?)\*\*$/);
          const field = line.match(/^[-*•]\s+\*\*([^*]+):\*\*\s*(.*)$/);

          if (record) {
            const card = document.createElement("article");
            card.className = "phenotype-card";

            const header = document.createElement("div");
            header.className = "phenotype-card__header";

            const icon = document.createElement("span");
            icon.className = "record-icon";
            icon.setAttribute("aria-hidden", "true");
            icon.textContent = "C";

            const title = document.createElement("h3");
            title.textContent = clean(record[1]);
            header.append(icon, title);

            cardBody = document.createElement("div");
            cardBody.className = "phenotype-card__body";
            card.append(header, cardBody);
            fragment.append(card);
          } else if (field && cardBody) {
            const row = document.createElement("div");
            row.className = "result-field";

            const label = document.createElement("span");
            label.className = "field-label";
            label.textContent = clean(field[1]);

            const value = document.createElement("span");
            value.className = "field-value";
            value.textContent = clean(field[2]);
            row.append(label, value);
            cardBody.append(row);
          } else {
            cardBody = null;
            const paragraph = document.createElement("p");
            paragraph.textContent = clean(line);
            fragment.append(paragraph);
          }
        }

        answer.replaceChildren(fragment);
        copyButton.hidden = false;
      }

      new MutationObserver(formatCipherAnswer).observe(answer, {
        childList: true,
        subtree: true
      });

      copyButton.addEventListener("click", async () => {
        await navigator.clipboard.writeText(plainAnswer);
        copyButton.textContent = "Copied!";
        setTimeout(() => { copyButton.textContent = "Copy answer"; }, 1600);
      });
    })();
  </script>

</body>
</html>
