<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="Natural-language search of CIPHER phenotypes and data dictionaries." />
  <title>CIPHER AI</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="shell">
    <header>
      <div class="eyebrow">CIPHER phenotype library</div>
      <h1>Ask CIPHER</h1>
      <p class="lede">Search phenotypes, algorithms, variables, and data dictionaries in natural language.</p>
    </header>

    <section class="card">
      <label for="question">Question</label>
      <textarea id="question" rows="5" placeholder="Example: Find validated hypertension phenotypes that use diagnosis codes."></textarea>
      <div class="actions">
        <button id="askButton">Ask CIPHER</button>
        <span id="status" aria-live="polite"></span>
      </div>
    </section>

    <section class="card answer-card" id="answerCard" hidden aria-live="polite">
      <div class="answer-heading">
        <div>
          <div class="result-label" id="resultLabel">CIPHER result</div>
          <h2 id="answerTitle">Answer</h2>
        </div>
        <button class="copy-button" id="copyButton" type="button" hidden>Copy answer</button>
      </div>
      <div id="answer" class="answer-content"></div>
      <details id="toolDetails">
        <summary>Queries used</summary>
        <div id="tools" class="tool-list"></div>
      </details>
    </section>

    <footer>
      <p>CIPHER AI retrieves and explains CIPHER records. It is not a clinical decision tool.</p>
    </footer>
  </main>
  <script src="config.js"></script>
  <script src="app.js?v=5"></script>

</body>
</html>
